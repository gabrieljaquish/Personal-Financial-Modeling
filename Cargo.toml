[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# `oracles/` and `tools/` are never workspace members (ARCHITECTURE.md §3, §10.3):
# the copyleft boundary is a subprocess and a file format, never an import.

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.84"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Crates created in this workspace. External dependencies are added by the
# milestone that first needs them (ARCHITECTURE.md §3), never speculatively.
pfp-domain = { path = "crates/pfp-domain" }
pfp-money = { path = "crates/pfp-money" }
pfp-params = { path = "crates/pfp-params" }
pfp-explain = { path = "crates/pfp-explain" }
pfp-tax = { path = "crates/pfp-tax" }
pfp-server = { path = "crates/pfp-server" }
sha2 = "0.10"
# M0 engine slice. `serde` is the only runtime dependency of `pfp-domain` and
# `pfp-money`; `smallvec` backs the `Line` node's inline input and parameter lists
# (ARCHITECTURE.md §4.2). All are MIT OR Apache-2.0 and build for wasm32.
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
smallvec = { version = "1.15", features = ["serde"] }
# `pfp-params` parses the parameter TOML from `&str` (no I/O). Parser only: no
# `display`, no `preserve_order` (the tables are walked through `BTreeMap`s, D8).
# MIT OR Apache-2.0; pure Rust, builds for wasm32.
toml = { version = "0.9", default-features = false, features = ["std", "parse", "serde"] }
# Test-only: fixture loading, property tests and their arbitrary-precision reference.
serde_json = "1.0.149"
proptest = { version = "1.7", default-features = false, features = ["std"] }
num-bigint = "0.4"

# Workspace-wide lint policy. Every crate opts in with `[lints] workspace = true`.
# Engine crates additionally `#![forbid(unsafe_code)]` at the crate root.
[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Determinism rules D1/D6/D8 (ARCHITECTURE.md §4.3): the disallowed lists live in
# `clippy.toml`. They are enforced in the engine crates; the non-engine crates
# (`pfp-server`, `pfp-app`, `xtask`) allow them at their crate root.
disallowed_types = "deny"
disallowed_methods = "deny"
disallowed_macros = "deny"

[profile.release]
# Reproducible-build settings (ARCHITECTURE.md §9 item 3). `--remap-path-prefix`
# and `SOURCE_DATE_EPOCH` are supplied by the release workflow (M0 signing block).
codegen-units = 1
lto = "fat"
strip = "none"
panic = "abort"
