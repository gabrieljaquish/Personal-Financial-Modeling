[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# `oracles/` and `tools/` are never workspace members (ARCHITECTURE.md §3, §10.3):
# the copyleft boundary is a subprocess and a file format, never an import.

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.84"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Crates created in this workspace. External dependencies are added by the
# milestone that first needs them (ARCHITECTURE.md §3), never speculatively.
pfp-domain = { path = "crates/pfp-domain" }
pfp-money = { path = "crates/pfp-money" }
pfp-params = { path = "crates/pfp-params" }
pfp-explain = { path = "crates/pfp-explain" }
pfp-tax = { path = "crates/pfp-tax" }
pfp-server = { path = "crates/pfp-server" }
sha2 = "0.10"
# M0 engine slice. `serde` is the only runtime dependency of `pfp-domain` and
# `pfp-money`; `smallvec` backs the `Line` node's inline input and parameter lists
# (ARCHITECTURE.md §4.2). All are MIT OR Apache-2.0 and build for wasm32.
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
smallvec = { version = "1.15", features = ["serde"] }
# `pfp-params` parses the parameter TOML from `&str` (no I/O). Parser only: no
# `display`, no `preserve_order` (the tables are walked through `BTreeMap`s, D8).
# MIT OR Apache-2.0; pure Rust, builds for wasm32.
toml = { version = "0.9", default-features = false, features = ["std", "parse", "serde"] }
# Test-only: fixture loading, property tests and their arbitrary-precision reference.
serde_json = "1.0.149"
proptest = { version = "1.7", default-features = false, features = ["std"] }
num-bigint = "0.4"
# M0 server: TLS on loopback (ADR-006, SECURITY.md §6). Every crate below is
# `default-features = false` with the smallest feature set that is used, so that
# neither `aws-lc-rs` (CMake/bindgen) nor TLS 1.2 nor OpenSSL is ever compiled
# (ADR-001). Only `pfp-server` depends on them (ARCHITECTURE.md §3).
#   tokio         MIT                        runtime, loopback listener, handshake timeout
#   rustls        Apache-2.0 OR ISC OR MIT   TLS 1.3 only, `ring` provider
#   tokio-rustls  MIT OR Apache-2.0          `TlsAcceptor`
#   rcgen         MIT OR Apache-2.0          name-constrained CA + leaf, DER only (no `pem`)
#   time          MIT OR Apache-2.0          certificate validity; the requirement is the
#                                            first release without RUSTSEC-2026-0009
#   zeroize       Apache-2.0 OR MIT          the trait `rcgen`'s `zeroize` feature implements
#                                            for its key pair; already in the rustls graph
tokio = { version = "1.53", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring"] }
rcgen = { version = "0.14.7", default-features = false, features = ["crypto", "ring", "zeroize"] }
time = { version = "0.3.47", default-features = false, features = ["std"] }
zeroize = { version = "1.8", default-features = false }
# M0 server: HTTP, session and API (ADR-006, ADR-015, ADR-017). Same rule: no default
# features. No HTTP client exists in this graph (ADR-020): hyper has `server` only.
#   axum        MIT                 router, extractors, `from_fn`. NO `tokio` feature, so
#                                   `axum::serve` (a plaintext acceptor) is never compiled
#   hyper       MIT                 HTTP/1.1 server connection; no `client`, no `http2`
#   hyper-util  MIT                 `TokioIo`, `TokioTimer` only: no `server` feature, so its
#                                   protocol-sniffing `auto` connection builder is not compiled
#   tower       MIT                 `Layer`/`Service` plumbing for the router
#   utoipa      MIT OR Apache-2.0   OpenAPI document from the Rust DTOs (ADR-017)
#   subtle      BSD-3-Clause        constant-time token comparison; already in the rustls graph
#   getrandom   MIT OR Apache-2.0   256-bit tokens; the 0.2 line `ring` already links, so this
#                                   adds no crate. (The lock also holds getrandom 0.3.x, reached
#                                   transitively through other crates; nothing here names it.)
axum = { version = "0.8.9", default-features = false, features = ["json"] }
hyper = { version = "1.11", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
utoipa = { version = "5.5", default-features = false, features = ["macros"] }
subtle = { version = "2.6", default-features = false }
getrandom = { version = "0.2.17", default-features = false }
# M0 launcher and embedded shell. Same rule: no default features.
#   rust-embed  MIT   compiles `web/dist` into the binary (ARCHITECTURE.md §1, §9).
#                     `debug-embed`: debug builds embed exactly as release builds do, so
#                     tests exercise what ships; `deterministic-timestamps`: reproducible
#                     builds. NOT `interpolate-folder-path` (pulls an MPL-2.0 crate) and
#                     no compression.
#   rustix      Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT
#                     safe `setrlimit`, `flock`, `getuid` and signals for the launcher,
#                     so `pfp-app` needs no `unsafe`
rust-embed = { version = "8.12", default-features = false, features = ["debug-embed", "deterministic-timestamps"] }
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process"] }
# Test-only: response-header and OpenAPI snapshots (named by ADR-001). Apache-2.0.
insta = { version = "1.48", default-features = false }
# Test-only: parses the generated certificates to assert criticality, pathLen,
# name constraints, SANs, EKU and validity. MIT OR Apache-2.0.
x509-parser = { version = "0.18.1", default-features = false }

# Workspace-wide lint policy. Every crate opts in with `[lints] workspace = true`.
# Engine crates additionally `#![forbid(unsafe_code)]` at the crate root.
[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Determinism rules D1/D6/D8 (ARCHITECTURE.md §4.3): the disallowed lists live in
# `clippy.toml`. They are enforced in the engine crates; the non-engine crates
# (`pfp-server`, `pfp-app`, `xtask`) allow them at their crate root.
disallowed_types = "deny"
disallowed_methods = "deny"
disallowed_macros = "deny"

[profile.release]
# Reproducible-build settings (ARCHITECTURE.md §9 item 3). `--remap-path-prefix`
# and `SOURCE_DATE_EPOCH` are supplied by the release workflow (M0 signing block).
codegen-units = 1
lto = "fat"
strip = "none"
panic = "abort"
