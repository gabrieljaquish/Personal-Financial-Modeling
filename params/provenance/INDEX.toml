# Archived primary documents (params/provenance/)
#
# This is the catalogue of the primary text that parameter tables under
# `params/` cite (`DOMAIN-MODEL.md` §15, `TESTING.md` §12 step 1,
# `docs/contributing.md` §1.1). Every file here is the publisher's own bytes,
# unmodified; where the published original is a PDF, a `pdftotext -layout`
# extraction is archived beside it so the values are greppable, and the
# extraction carries its own checksum. Extractions are derived artefacts: the
# PDF or the official HTML is the authority, never the `.txt`.
#
# STATUS: PENDING HUMAN VERIFICATION. Nothing here has been read back against
# the publisher's copy by a human. No vintage may lock on these documents and
# no entry may be added to `params/VINTAGES.lock` until that has happened
# (`TESTING.md` §5.2, §12 step 11; `docs/contributing.md` §3.2, ADR-022).
#
# Layout: one directory per publisher (`irs/`, `usc/`, `congress/`, and `bls/`
# for the price-index series, archived by a separate task). `TESTING.md` §12
# step 1 says `params/provenance/<year>/`; the executable precedent in
# `xtask/src/hygiene.rs` is publisher-keyed and a "current text" statute
# archive has no single year, so publisher-keyed is what is used here. The
# mismatch with `TESTING.md` §12 step 1 is a design erratum for a human to
# settle; it is listed in `docs/verification/m0-hand-verification.md` §0.
#
# Entries are `[[document]]` so that separately-archived sets append to this
# same list rather than replacing the file. The BLS price-index series under
# `bls/` are archived and catalogued by a separate task in
# `params/provenance/bls/MANIFEST.md`; they are NOT listed here. The two
# catalogues should be merged, or one made normative, before a vintage locks.

schema         = 1
retrieved_all  = "2026-09-18"
verification   = "pending-human-verification"

