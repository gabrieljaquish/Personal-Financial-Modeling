[package]
name = "xtask"
description = "Repository task runner: hygiene gates and build helpers (never shipped)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# The data-hygiene gate drives the typed parameter loader over every table under
# `params/` (TESTING.md §11.2 gate 9), so a table no crate embeds is still checked.
pfp-params = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
