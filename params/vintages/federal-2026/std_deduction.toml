# Basic standard deduction, tax years 2025 and 2026.
#
# BASIC amounts only (26 USC 63(c)(2) as modified by 63(c)(7)). The additional
# aged/blind amount (63(f)) and the dependent limit (63(c)(5)) are a different
# rule with a different base year and are out of this vintage's scope; they are
# printed in Rev. Proc. 2025-32 §4.14(2) and (3), printed page 18.
#
# ---------------------------------------------------------------------------
# UNRESOLVED RESIDUAL — READ BEFORE USING THIS TABLE
# ---------------------------------------------------------------------------
# The rule this table encodes is what 26 USC 63(c)(7)(B)(ii) states in terms:
# round the INCREASE over the 2024 base down to a multiple of $50. That rule
# cannot produce the published 2026 head-of-household amount of $24,150.
# Residual $25. The check needs no index series at all — it is divisibility:
#
#   single  15,750 -> 16,100   increase   350 = 7   x 50   OK
#   mfs     15,750 -> 16,100   increase   350 = 7   x 50   OK
#   mfj/qss 31,500 -> 32,200   increase   700 = 14  x 50   OK
#   hoh     23,625 -> 24,150   increase   525 = 10.5 x 50  NOT a multiple of $50
#
# Flooring the increase can only land on $24,125 or $24,175; the published
# figure lies strictly between them. `hoh` is the only discriminating status
# because $15,750 and $31,500 are themselves multiples of $50, so for those
# statuses "floor the increase" and "floor the total" agree for every possible
# cost-of-living adjustment. $23,625 is a multiple of $25 but not of $50, and
# the published figure lands on the TOTAL-flooring rule.
#
# Nothing here was adjusted to close the gap: no base amount, no index value,
# no rounding rule, and no search for a cost-of-living adjustment that "works".
# Per `docs/contributing.md` §3 a disagreement between the statutory pipeline
# and a published number is a finding for a human, not a defect to tune away.
# The decision a human owes this table is recorded in
# `docs/verification/m0-hand-verification.md` (decision B2) and in
# `[hand_verification]` below. It
# blocks seam S1, because `RoundingRule.basis` has no value meaning "floor the
# total" and adding one changes what the engine computes.
#
# STATUS: PENDING HAND VERIFICATION. Not locked. See `vintages/federal-2026/VINTAGE.md`.

id           = "irs.std_deduction"
unit         = "USD"                 # integer dollars as published
period       = "year"
breakdown    = ["filingStatus"]      # single | mfj | mfs | hoh | qss
as_of        = "2025-10-09"          # Rev. Proc. 2025-32 §1: adjustments for
                                     # Code provisions "as in effect on
                                     # October 9, 2025". Both rows of this
                                     # table come from that one document.
verification = "pending-hand-verification"

# ---------------------------------------------------------------------------
# Published values
# ---------------------------------------------------------------------------
# 2025: Rev. Proc. 2025-32 §3.01, printed page 9. NOTE THE SUPERSESSION — the
#       2025 row does NOT come from a 2025-dated revenue procedure. Rev. Proc.
#       2024-40 §2.15(1) (printed page 12) printed $30,000 / $22,500 / $15,000
#       / $15,000 for 2025; PL 119-21 §70102 applies to taxable years beginning
#       after 2024-12-31, and Rev. Proc. 2025-32 §3.01 prints the replacement
#       table and ends "Accordingly, section 2.15(1) of Rev. Proc. 2024-40 is
#       removed." The withdrawn figures are easy to pick up from a stale source
#       and are not the law for 2025.
# 2026: Rev. Proc. 2025-32 §4.14(1), printed page 18.
#
# `qss` shares the §1(j)(2)(A) row with `mfj` in both years; the column is
# duplicated explicitly rather than left absent.

[values.mfj]
2025 = 31500
2026 = 32200

[values.qss]
2025 = 31500
2026 = 32200

[values.hoh]
2025 = 23625
2026 = 24150                         # NOT reproduced by the rule below; see
                                     # the residual note at the top.

[values.single]
2025 = 15750
2026 = 16100

[values.mfs]
2025 = 15750
2026 = 16100

# ---------------------------------------------------------------------------
# Projection
# ---------------------------------------------------------------------------

[projection]
rule         = "index"
index        = "cpi.chained"         # 26 USC 63(c)(7)(B)(ii)(II) routes to the
                                     # cost-of-living adjustment of 26 USC
                                     # 1(f)(3), whose index is the C-CPI-U of
                                     # 1(f)(6)(A)
index_series = "cpi.chained.aug12m"  # 26 USC 1(f)(6)(B); resolves against the
                                     # `index_series` name an archived series
                                     # table declares (`params/index-series/`)
lag_years    = 1                     # SHAPE EXTENSION (deviation 7). 26 USC
                                     # 63(c)(7)(B)(ii)(II) takes "the
                                     # cost-of-living adjustment determined
                                     # under section 1(f)(3) for the calendar
                                     # year in which the taxable year begins",
                                     # and 1(f)(3)(A)(i) reads "the C-CPI-U for
                                     # the preceding calendar year".
base_year    = 2024                  # 26 USC 63(c)(7)(B)(ii)(II), verbatim:
                                     # "... determined by substituting '2024'
                                     # for '2016' in subparagraph (A)(ii)
                                     # thereof." A scalar is correct here: one
                                     # base year, both tax years, every status.

# First adjusted year is 2026: 63(c)(7)(B)(ii) applies "In the case of a
# taxable year beginning after 2025", so the 2025 published amounts ARE the
# unadjusted base amounts. The 2025 row of `values` equals `base_values` for
# every status, which is a property of the statute and not a placeholder.
first_adjusted_year = 2026

# Statutory base-year amounts, integer dollars.
#
#   single = 15750  — 26 USC 63(c)(2)(C) ("in any other case"), the $3,000
#                     replaced by $15,750 under 63(c)(7)(A)(ii).
#   mfs    = 15750  — the same (C): `mfs` is neither (A) nor (B).
#   hoh    = 23625  — 26 USC 63(c)(2)(B), the $4,400 replaced by $23,625 under
#                     63(c)(7)(A)(i).
#   mfj    = 31500  — DERIVED, not stated. 26 USC 63(c)(2)(A) is "200 percent
#   qss    = 31500    of the dollar amount in effect under subparagraph (C) for
#                     the taxable year", and 200% x $15,750 = $31,500 exactly.
#
# The derivation has a consequence the shape cannot carry, and it is a real
# one, not a pedantic one: §63(c)(2)(A) doubles the amount "in effect ... for
# the taxable year", so the statutory pipeline is INDEX AND ROUND THE `single`
# AMOUNT, THEN DOUBLE — not double the base and then index and round it. The
# two agree only when the doubled $50 increment (i.e. $100) divides the result,
# which it does for the 2026 published figure; they can differ by $50 in a year
# where it does not. An implementation that indexes `mfj` independently off
# 31500 is therefore right by coincidence, and the coincidence is not
# load-bearing anywhere in the statute. `base_values.mfj` is carried for shape
# and for the divisibility check; it is not an independent statutory amount.
[projection.base_values]
mfj    = 31500
qss    = 31500
hoh    = 23625
single = 15750
mfs    = 15750

[projection.rounding]
increment = 50
direction = "down"                   # "rounded to the next lowest multiple of
                                     # $50"
basis     = "IncreaseOverBase"       # 26 USC 63(c)(7)(B)(ii), FLUSH TEXT: "If
                                     # any increase under this clause is not a
                                     # multiple of $50, such increase shall be
                                     # rounded to the next lowest multiple of
                                     # $50."
                                     #
                                     # CITATION, DELIBERATELY NOT 26 USC
                                     # 1(f)(7). 1(f)(7)(A) rounds "any increase
                                     # determined under ... section 63(c)(4)",
                                     # and 63(c)(7)(B)(i) says "Paragraph (4)
                                     # shall not apply to the dollar amounts
                                     # contained in paragraphs (2)(B) and
                                     # (2)(C)" — which switches off 63(c)(4)
                                     # and with it 1(f)(7)(A)'s only hook into
                                     # the basic standard deduction. The rule
                                     # that survives is the one 63(c)(7)(B)(ii)
                                     # states for itself. `DOMAIN-MODEL.md` §15
                                     # attributes it to 1(f)(7); the rule it
                                     # states is right, the citation is not.
                                     #
                                     # There is also NO $25 variant here, in
                                     # contrast to the bracket table: 1(f)(7)(B)
                                     # expressly excludes 63(c)(4) from the $25
                                     # substitution, and 63(c)(7)(B)(ii) names
                                     # $50 with no filing-status variation. So
                                     # `increment` is honestly a scalar on this
                                     # table. `mfs` and `single` coincide here
                                     # for a different reason than they
                                     # coincide in the bracket table.

# ---------------------------------------------------------------------------
# Open hand-verification items for THIS table (`TESTING.md` §5.2)
# ---------------------------------------------------------------------------
[hand_verification]
open = [
  "BLOCKING: the rule encoded here (26 USC 63(c)(7)(B)(ii), floor the increase to $50) does not produce the published 2026 hoh amount $24,150; residual $25. A human must decide whether the project implements the statute as written and records that it does not reproduce the IRS figure, or follows IRS practice (floor the total) and records the departure from the literal text. The second choice needs a new RoundingRule.basis value before seam S1 freezes at M0. Nothing in this file may be adjusted to make either choice come out.",
  "mfj/qss ordering: that 63(c)(2)(A) requires round-the-single-then-double rather than double-then-index follows from 'the dollar amount in effect under subparagraph (C) for the taxable year'. No published source stating the ordering explicitly was found.",
  "index_series: 26 USC 1(f)(6)(A) names the index by title only and no statutory text maps it to a BLS series id (see params/index-series/cpi-chained-suur0000sa0.toml).",
  "lag_years: 'the C-CPI-U for the preceding calendar year' (26 USC 1(f)(3)(A)(i)), reached through 63(c)(7)(B)(ii)(II), as for the bracket table.",
  "26 USC 1(f)(3)(C) substitution mechanics for a post-2016 base year, as for the bracket table.",
  "26 USC 1(f)(6)(A) revision-vintage freeze: the archived series is a 2026-09-18 snapshot and may differ from the values the IRS read.",
]

