# ---------------------------------------------------------------------------
# Revision vintage — which published values of a revisable series count
# ---------------------------------------------------------------------------
[revision_vintage]
snapshot_date = "2026-09-18"

# The C-CPI-U, unlike the CPI-U and CPI-W, is revised after first publication.
# CPI news release USDL-25-1356 (August 2025), archived as
# `params/provenance/bls/cpi_09112025.htm`, states it twice and not quite
# consistently. Technical Note: the CPI-U and CPI-W "are considered final when
# released, but the C-CPI-U is issued in preliminary form and subject to three
# subsequent quarterly revisions." Table 5 footnote 1: the C-CPI-U "is issued
# first in preliminary form ... and is subject to four revisions", then gives
# the finalisation schedule:
#
#   "The C-CPI-U indexes are updated quarterly until they become final.
#    January-March indexes are final in January of the following year;
#    April-June indexes are final in April of the following year;
#    July-September indexes are final in July of the following year;
#    October-December indexes are final in October of the following year."
#
# Both sentences are archived; neither was reconciled here, and the
# three-versus-four discrepancy is BLS's own.
#
# FINALITY OF THE WINDOWS THIS VINTAGE READS. Applying that schedule at the
# 2026-09-18 snapshot date, every month of September 2023 - August 2024 and of
# September 2024 - August 2025 has passed its finalisation date, and none
# carries a footnote code in the archived file. The same holds for the 2016 and
# 2017 windows. The finality claim rests on the release's schedule, cited
# above, NOT on `su.footnote`: that file is 51 bytes and binds exactly two
# codes, `I` = Initial and `U` = Interim. It says nothing about a blank code,
# and no archived file binds a blank code to "final".
windows_final = [2016, 2017, 2024, 2025]
finality_authority = "params/provenance/bls/cpi_09112025.htm (USDL-25-1356), Table 5 footnote 1, applied at snapshot_date"
footnote_codes_defined = ["I = Initial", "U = Interim"]

# THE OPEN PROBLEM, and it is the important one on this table.
#
# 26 USC 1(f)(6)(A) continues: "The values of the Chained Consumer Price Index
# for All Urban Consumers taken into account for purposes of determining the
# cost-of-living adjustment for any calendar year under this subsection shall
# be the latest values so published as of the date on which such Bureau
# publishes the initial value of the Chained Consumer Price Index for All Urban
# Consumers for the month of August for the preceding calendar year."
#
# For the calendar-year 2026 adjustment that freeze date is the publication of
# the initial August 2025 C-CPI-U — USDL-25-1356, embargoed until 8:30 a.m. ET
# Thursday, September 11, 2025. On that date several months of the September
# 2024 - August 2025 window were still interim and August 2025 was initial. The
# observations transcribed above are TODAY'S values for those months, which are
# final and may differ from the ones the IRS read.
#
# BLS does not republish superseded vintages: the flat files and the public API
# both serve the current vintage only, and no "as published on 2025-09-11"
# series id exists. Recovering that vintage means recovering the August 2025
# release's own tables.
#
# Consequence, stated so nobody misreads a failure: an uprating-reproduction
# test run against this table could disagree with a published threshold for a
# reason that is not the code — a revision moving a window mean across a $50 or
# $25 rounding step. Under `docs/contributing.md` §3.1 and §3.3 that is evidence
# to report, never a licence to nudge an observation or a rounding rule.
# Whether any such crossing occurs is NOT asserted here and was not tested.
statutory_freeze_rule = "26 USC 1(f)(6)(A)"
statutory_freeze_event_cy2026 = "publication of the initial August 2025 C-CPI-U: USDL-25-1356, 2025-09-11"
snapshot_may_differ_from_freeze = true

# ---------------------------------------------------------------------------
# Open hand-verification items for THIS table (`TESTING.md` §5.2)
# ---------------------------------------------------------------------------
[hand_verification]
open = [
  "M0 GATE: the identity of the series behind index = 'cpi.chained'. 26 USC 1(f)(6)(A) names the index by title only; the mapping to SUUR0000SA0 rests on su.series and the BLS chained-CPI FAQ, not on statute. Cannot be discharged by reading 26 USC 1 or 63.",
  "The 26 USC 1(f)(6)(A) revision-vintage freeze: decide whether the project computes against today's final values and records any residual, or recovers the values as published on 2025-09-11 from the August 2025 release's own tables.",
  "BLS states both 'three subsequent quarterly revisions' (Technical Note) and 'four revisions' (Table 5 footnote 1) in the same release. Unreconciled; it does not affect which months are final at this snapshot, but a reader will trip over it.",
]

[hand_verification.carried_forward]
# Not a problem for this vintage; a problem for the next one.
#
# There is no October 2025 CPI. Federal appropriations lapsed 2025-10-01 to
# 2025-11-12; BLS could not collect the October reference-period data and
# cancelled the release. In the archive: SUUR0000SA0 has no 2025-M10 row at
# all; `params/provenance/bls/2025-lapse-revised-release-dates.htm` records the
# October 2025 CPI release as "Canceled"; and the shutdown FAQ records that BLS
# did not issue an October 2025 CPI news release.
#
# The windows this vintage reads (CY2024 and CY2025, and the CY2016 and CY2017
# bases) are all complete. The gap falls inside September 2025 - August 2026,
# which is the C-CPI-U for calendar year 2026 and therefore feeds the
# adjustment for tax year 2027.
#
# DO NOT INVENT A RULE FOR THE MISSING MONTH. 1(f)(6)(B) says "the average of
# the C-CPI-U as of the close of the 12-month period" and says nothing about
# eleven months. Whether the CY2026 figure is an eleven-month mean, a mean over
# an imputed October, or something the Secretary prescribes is an open legal
# question, and it belongs against whatever the IRS publishes for tax year 2027.
item = "October 2025 is absent from the series; the CY2026 window has 11 of 12 months. Affects the tax-year-2027 adjustment, not this vintage."
gate = "the 2027 annual parameter update (TESTING.md §12)"

