# The price-index series the projection rules of this vintage read.
#
# This is NOT a parameter table. It carries no `projection` block and no
# `RoundingRule`, because neither means anything here: an index observation is
# not an amount that gets uprated. `TESTING.md` §11.2 gate 9 and the
# "a table without a projection rule is a CI error" rule are both about
# parameter tables. No design document specifies the shape of an archived
# index-series table or exempts one from that rule; `kind` below is the
# distinction, and the gap is reported as an erratum (`vintages/federal-2026/VINTAGE.md`,
# deviation 4).
#
# Values are DECIMAL STRINGS, not TOML floats. A bare `135.837` in TOML is
# IEEE-754 binary64, which `ARCHITECTURE.md` §4.3 D3 and ADR-007 forbid in a
# money path; two of the four window means below are non-terminating decimals
# (denominator 1200) and must be carried as exact rationals. The strings are
# the published values, digit for digit, with no rounding, truncation or
# adjustment.
#
# STATUS: PENDING HAND VERIFICATION. Not locked. See `vintages/federal-2026/VINTAGE.md`.

id           = "bls.cpi.chained.suur0000sa0"
kind         = "index-series"
index_series = "cpi.chained.aug12m"  # the name a parameter table writes in
                                     # `projection.index_series` to read this
                                     # series: the index (`cpi.chained`) under
                                     # the [window] below (12 months ending
                                     # August). Binding a table to its archived
                                     # series is data, not code.
series_id    = "SUUR0000SA0"
unit         = "index"
base_period  = "DECEMBER 1999=100"
periodicity  = "monthly"
as_of        = "2026-09-18"          # the SNAPSHOT date of the archived flat
                                     # file, not a law date. The C-CPI-U is
                                     # revisable, so a dated snapshot is the
                                     # only honest as-of; see
                                     # [revision_vintage] below.
verification = "pending-hand-verification"

# What the statute names, and what it does not.
#
# 26 USC 1(f)(6)(A), verbatim: "The term 'C-CPI-U' means the Chained Consumer
# Price Index for All Urban Consumers (as published by the Bureau of Labor
# Statistics of the Department of Labor)."
#
# The statute names the index by its published title and by its publisher. It
# does NOT cite a BLS series id, and no statutory text maps the title to one.
# The mapping to `SUUR0000SA0` is a project identification made from BLS's own
# catalogue, and it is the `TESTING.md` §5.2 M0 gate item "the identity of the
# index series behind index = 'cpi.chained'". It is open.
#
# The evidence for the identification, both inside the archive:
#   - `params/provenance/bls/time-series/su.series` carries the row
#     SUUR0000SA0 | area 0000 | item SA0 | seasonal U | periodicity R |
#     DECEMBER 1999=100 | "All items in U.S. city average, all urban consumers,
#     chained, not seasonally adjusted".
#   - `params/provenance/bls/chained-cpi-questions-and-answers.htm`, table 1
#     ("Published C-CPI-U series"), lists SUUR0000SA0 as the all-items series
#     and states that all C-CPI-U series are published only at the U.S. city
#     average level.
statutory_name = "Chained Consumer Price Index for All Urban Consumers (C-CPI-U)"

# The averaging window the statute names.
#
# 26 USC 1(f)(6)(B), verbatim: "The C-CPI-U for any calendar year is the
# average of the C-CPI-U as of the close of the 12-month period ending on
# August 31 of such calendar year."
#
# So the C-CPI-U for calendar year Y is the simple mean of the twelve monthly
# observations for September of Y-1 through August of Y. The statute says "the
# average" and prescribes no weighting, no rounding and no truncation.
[window]
kind         = "trailing-12-month-mean"
ends_month   = 8                     # August
ends_day     = 31
months       = 12
first_month  = "September of the preceding calendar year"
divisor      = 12
source       = "26 USC 1(f)(6)(B)"

# A projection needs the RATIO C-CPI-U(Y-1) / C-CPI-U(B), in which the divisor
# 12 cancels. The ratio is therefore a ratio of the two twelve-month SUMS, and
# an implementation that forms the sums as exact rationals never has to
# represent a non-terminating mean at all. `window_sum` below is recorded for
# exactly that reason; it is derived arithmetic over `observations`, not an
# independent datum, and it is exact (every observation has three decimals).

# ---------------------------------------------------------------------------
# Observations — copied from the archived flat file with full precision
# ---------------------------------------------------------------------------
# Source: `params/provenance/bls/time-series/su.data.1.AllItems`, series
# SUUR0000SA0. Only the four calendar-year windows this vintage's projections
# read are transcribed; the archive holds the whole series, 1999-M12 through
# 2026-M08.
#
# Which window feeds what (26 USC 1(f)(3)(A)(i): the adjustment for calendar
# year Y reads the C-CPI-U for the PRECEDING calendar year):
#   CY2016 — denominator for the tops of the 10% and 12% brackets, tax year 2026
#   CY2017 — denominator for bracket thresholds, tax year 2025 (all edges) and
#            tax year 2026 (the four edges clause (i) names)
#   CY2024 — denominator for the standard deduction (base year 2024), and the
#            numerator for the tax-year-2025 adjustment
#   CY2025 — numerator for the tax-year-2026 adjustment
#
# Every observation below carries NO footnote code in the archived file. The
# `su.footnote` code table defines exactly two codes — `I` = Initial and
# `U` = Interim — and nothing else; it does not define the absence of a code.
# See [revision_vintage] for what the absence is inferred to mean, and on what
# authority.

